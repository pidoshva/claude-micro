<svg xmlns="http://www.w3.org/2000/svg" width="560" height="260" viewBox="0 0 560 260" font-family="SF Mono, Menlo, Consolas, monospace">
  <defs>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#304FFE" stop-opacity="0.55"/><stop offset="100%" stop-color="#304FFE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF6D00" stop-opacity="0.55"/><stop offset="100%" stop-color="#FF6D00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00FF4C" stop-opacity="0.5"/><stop offset="100%" stop-color="#00FF4C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-white" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8B54F7" stop-opacity="0.55"/><stop offset="100%" stop-color="#8B54F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- device body -->
  <rect x="16" y="14" width="528" height="212" rx="22" fill="#101018" stroke="#34343f" stroke-width="2"/>
  <rect x="20" y="18" width="520" height="204" rx="19" fill="none" stroke="#1d1d28" stroke-width="1"/>

  <!-- agent row: keycaps with LED glows -->
  <g>
    <rect x="42"  y="36" width="54" height="46" rx="9" fill="url(#glow-blue)"/>
    <rect x="46"  y="40" width="46" height="38" rx="7" fill="#191924" stroke="#304FFE" stroke-width="2"/>
    <rect x="106" y="36" width="54" height="46" rx="9" fill="url(#glow-orange)"/>
    <rect x="110" y="40" width="46" height="38" rx="7" fill="#191924" stroke="#FF6D00" stroke-width="2"/>
    <rect x="170" y="36" width="54" height="46" rx="9" fill="url(#glow-green)"/>
    <rect x="174" y="40" width="46" height="38" rx="7" fill="#191924" stroke="#00FF4C" stroke-width="2"/>
    <rect x="234" y="36" width="54" height="46" rx="9" fill="url(#glow-white)"/>
    <rect x="238" y="40" width="46" height="38" rx="7" fill="#191924" stroke="#d8d8e2" stroke-width="2"/>
    <rect x="298" y="36" width="54" height="46" rx="9" fill="url(#glow-purple)"/>
    <rect x="302" y="40" width="46" height="38" rx="7" fill="#191924" stroke="#8B54F7" stroke-width="2"/>
    <rect x="366" y="40" width="46" height="38" rx="7" fill="#191924" stroke="#2c2c38" stroke-width="2"/>
  </g>
  <text x="65"  y="64" fill="#304FFE" font-size="13">1</text>
  <text x="129" y="64" fill="#FF6D00" font-size="13">2</text>
  <text x="193" y="64" fill="#00FF4C" font-size="13">3</text>
  <text x="257" y="64" fill="#d8d8e2" font-size="13">4</text>
  <text x="321" y="64" fill="#8B54F7" font-size="13">5</text>
  <text x="385" y="64" fill="#565666" font-size="13">6</text>
  <text x="428" y="56" fill="#7a7a8c" font-size="12">← agent row</text>
  <text x="428" y="72" fill="#565666" font-size="11">RGB per key</text>

  <!-- action row -->
  <g fill="#15151f" stroke="#2c2c38" stroke-width="1.5">
    <rect x="46"  y="104" width="40" height="32" rx="6"/>
    <rect x="94"  y="104" width="40" height="32" rx="6"/>
    <rect x="142" y="104" width="40" height="32" rx="6"/>
    <rect x="190" y="104" width="40" height="32" rx="6"/>
    <rect x="238" y="104" width="40" height="32" rx="6"/>
    <rect x="286" y="104" width="40" height="32" rx="6"/>
    <rect x="334" y="104" width="40" height="32" rx="6"/>
  </g>
  <g fill="#565666" font-size="11">
    <text x="61"  y="124">7</text><text x="106" y="124">8</text><text x="154" y="124">9</text>
    <text x="199" y="124">10</text><text x="247" y="124">11</text><text x="295" y="124">12</text><text x="343" y="124">13</text>
  </g>
  <text x="428" y="124" fill="#7a7a8c" font-size="12">← action row</text>

  <!-- knob -->
  <circle cx="120" cy="178" r="24" fill="#191924" stroke="#8B54F7" stroke-width="2.5"/>
  <circle cx="120" cy="178" r="17" fill="none" stroke="#2c2c38" stroke-width="1.5"/>
  <line x1="120" y1="158" x2="120" y2="167" stroke="#8B54F7" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="218" fill="#565666" font-size="11" text-anchor="middle">knob · modes &amp; models</text>

  <!-- joystick -->
  <circle cx="440" cy="178" r="24" fill="#15151f" stroke="#2c2c38" stroke-width="2"/>
  <circle cx="446" cy="172" r="11" fill="#8B54F7"/>
  <circle cx="443" cy="169" r="4" fill="#b28cff"/>
  <text x="440" y="218" fill="#565666" font-size="11" text-anchor="middle">joystick · d-pad &amp; game</text>

  <text x="280" y="248" fill="#43434f" font-size="11" text-anchor="middle">schematic, not to scale — the LEDs are your sessions' live states</text>
</svg>
