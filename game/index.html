<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>micro-drift</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// micro-drift -- the charge-up easter egg. An arrow adrift in space, steered by
// the Micro's joystick (or arrow keys); touch anything and the run is over and
// the window goes away. Joystick positions arrive over SSE from the daemon as
// {a, d}: angle as a fraction of a full turn, distance 0..1 from center.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function fit() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
fit(); addEventListener('resize', fit);

const TAU = Math.PI * 2;
const state = {
  t: 0, over: false, score: 0,
  ship: { x: 0, y: 0, angle: 0.75 * TAU, speed: 0, r: 11 },
  stick: { a: 0.75, d: 0 },
  rocks: [], stars: [], sparks: [],
};
state.ship.x = W / 2; state.ship.y = H / 2;

for (let i = 0; i < 140; i++) {
  state.stars.push({ x: Math.random() * W, y: Math.random() * H, z: 0.2 + Math.random() * 0.8 });
}

// ---- input ------------------------------------------------------------
const es = new EventSource('/events');
es.onmessage = e => {
  try { const p = JSON.parse(e.data); state.stick = { a: p.a, d: p.d }; } catch {}
};
const held = new Set();
addEventListener('keydown', e => {
  if (e.key === 'Escape') return crash(true);
  held.add(e.key); keysToStick();
});
addEventListener('keyup', e => { held.delete(e.key); keysToStick(); });
function keysToStick() {
  let dx = (held.has('ArrowRight') ? 1 : 0) - (held.has('ArrowLeft') ? 1 : 0);
  let dy = (held.has('ArrowDown') ? 1 : 0) - (held.has('ArrowUp') ? 1 : 0);
  if (!dx && !dy) { state.stick.d = 0; return; }
  state.stick = { a: ((Math.atan2(dy, dx) / TAU) + 1) % 1, d: 1 };
}

// ---- rocks ------------------------------------------------------------
function spawnRock() {
  const r = 14 + Math.random() * 26;
  const side = Math.floor(Math.random() * 4);
  const speed = (60 + Math.random() * 90) * (1 + state.t / 45);   // ramps with time
  const pos = [
    { x: -r, y: Math.random() * H }, { x: W + r, y: Math.random() * H },
    { x: Math.random() * W, y: -r }, { x: Math.random() * W, y: H + r },
  ][side];
  // aimed loosely at the middle so everything crosses the play field
  const aim = Math.atan2(H / 2 - pos.y + (Math.random() - 0.5) * H * 0.7,
                         W / 2 - pos.x + (Math.random() - 0.5) * W * 0.7);
  const verts = [];
  const n = 7 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) verts.push(0.72 + Math.random() * 0.35);
  state.rocks.push({ ...pos, vx: Math.cos(aim) * speed, vy: Math.sin(aim) * speed,
                     r, verts, spin: (Math.random() - 0.5) * 2, rot: 0 });
}

// ---- game over --------------------------------------------------------
function crash(quiet) {
  if (state.over) return;
  state.over = true;
  if (!quiet) {
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * TAU, v = 40 + Math.random() * 260;
      state.sparks.push({ x: state.ship.x, y: state.ship.y,
                          vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.9 + Math.random() * 0.5 });
    }
  }
  fetch('/gameover', { method: 'POST' }).catch(() => {});
  setTimeout(() => { try { window.close(); } catch {} }, 1200);  // fallback browsers
}

// ---- loop -------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!state.over) {
    state.t += dt;
    state.score = Math.floor(state.t * 10);

    // steering: past the deadzone the stick sets heading directly, distance is throttle
    const s = state.ship;
    if (state.stick.d >= 0.3) {
      s.angle = state.stick.a * TAU;
      s.speed = Math.min(1, state.stick.d) * 340;
    } else {
      s.speed *= Math.pow(0.02, dt);            // glide to a stop
    }
    s.x = Math.max(s.r, Math.min(W - s.r, s.x + Math.cos(s.angle) * s.speed * dt));
    s.y = Math.max(s.r, Math.min(H - s.r, s.y + Math.sin(s.angle) * s.speed * dt));

    const want = Math.min(14, 3 + Math.floor(state.t / 6));
    if (state.rocks.length < want && Math.random() < 0.09) spawnRock();

    for (const k of state.rocks) {
      k.x += k.vx * dt; k.y += k.vy * dt; k.rot += k.spin * dt;
      if (Math.hypot(k.x - s.x, k.y - s.y) < k.r * 0.88 + s.r * 0.75) crash();
    }
    state.rocks = state.rocks.filter(k =>
      k.x > -60 && k.x < W + 60 && k.y > -60 && k.y < H + 60);
  }

  // ---- draw ----
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, W, H);
  for (const st of state.stars) {
    st.x -= st.z * 22 * dt;
    if (st.x < 0) { st.x = W; st.y = Math.random() * H; }
    ctx.fillStyle = `rgba(255,255,255,${0.25 + st.z * 0.5})`;
    ctx.fillRect(st.x, st.y, st.z * 1.8, st.z * 1.8);
  }

  ctx.strokeStyle = '#9aa4c0';
  ctx.lineWidth = 1.6;
  for (const k of state.rocks) {
    ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(k.rot);
    ctx.beginPath();
    k.verts.forEach((v, i) => {
      const a = (i / k.verts.length) * TAU;
      ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * k.r * v, Math.sin(a) * k.r * v);
    });
    ctx.closePath(); ctx.stroke(); ctx.restore();
  }

  if (!state.over || state.sparks.length === 0) {
    const s = state.ship;
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.angle);
    ctx.beginPath();
    ctx.moveTo(15, 0); ctx.lineTo(-10, 8.5); ctx.lineTo(-5, 0); ctx.lineTo(-10, -8.5);
    ctx.closePath();
    ctx.fillStyle = '#c9b7ff'; ctx.fill();
    ctx.strokeStyle = '#8b54f7'; ctx.lineWidth = 2; ctx.stroke();
    if (s.speed > 40) {                          // exhaust
      ctx.beginPath(); ctx.moveTo(-7, 0);
      ctx.lineTo(-16 - Math.random() * 10 * (s.speed / 340), 0);
      ctx.strokeStyle = 'rgba(255,180,80,0.8)'; ctx.stroke();
    }
    ctx.restore();
  }

  state.sparks = state.sparks.filter(p => (p.life -= dt) > 0);
  for (const p of state.sparks) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.fillStyle = `rgba(255,${120 + Math.floor(Math.random() * 120)},60,${p.life})`;
    ctx.fillRect(p.x, p.y, 3, 3);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '16px ui-monospace, monospace';
  ctx.fillText(String(state.score), 18, 30);
  if (state.over) {
    ctx.textAlign = 'center';
    ctx.font = '28px ui-monospace, monospace';
    ctx.fillText('game over', W / 2, H / 2 - 10);
    ctx.font = '16px ui-monospace, monospace';
    ctx.fillText(`score ${state.score}`, W / 2, H / 2 + 18);
    ctx.textAlign = 'left';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
